name: Update feeds

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-feeds
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build feeds
        run: python3 gamesheet_feed.py

      - name: Build schedule page
        # Fail-soft: never blocks the feed commit below. If the club Outlook calendar
        # cannot be read, the page is built from GameSheet only. Builds the site root
        # (docs/index.html), turns /schedule/ into a redirect to /, and keeps docs/CNAME.
        continue-on-error: true
        timeout-minutes: 4
        run: python3 site/build_site.py docs

      - name: Commit changed feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "No feed changes."
          else
            git commit -m "Update feeds $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
